<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台電 LOGO 迷因產生器</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --ink: #081f55;
      --red: #b40013;
      --paper: #fbfaf7;
      --panel: #19191c;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: #101012;
      color: #f5f5f5;
    }
    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 390px 1fr;
      gap: 20px;
      padding: 20px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid #323238;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .28);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      letter-spacing: 0;
    }
    .hint {
      margin: 0 0 16px;
      color: #b8b8bd;
      font-size: 14px;
      line-height: 1.55;
    }
    label {
      display: block;
      margin: 14px 0 7px;
      color: #e6e6e8;
      font-size: 14px;
      font-weight: 800;
    }
    textarea, input, select {
      width: 100%;
      border: 1px solid #44444c;
      border-radius: 8px;
      padding: 11px 12px;
      background: #101012;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    textarea { min-height: 74px; resize: vertical; }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    button {
      width: 100%;
      margin-top: 14px;
      border: 0;
      border-radius: 8px;
      padding: 13px 16px;
      background: #fff;
      color: #111;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }
    button.secondary {
      margin-top: 9px;
      background: #2c2c32;
      color: #fff;
      border: 1px solid #4a4a52;
    }
    .preview-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 40px);
      background: #080808;
      border: 1px solid #25252a;
      border-radius: 12px;
      overflow: auto;
      padding: 24px;
    }
    canvas {
      max-width: 100%;
      height: auto;
      background: #fff;
      box-shadow: 0 28px 80px rgba(0, 0, 0, .5);
    }
    .note {
      margin-top: 12px;
      color: #8f8f96;
      font-size: 12px;
      line-height: 1.55;
    }
    @media (max-width: 960px) {
      .app { grid-template-columns: 1fr; padding: 12px; }
      .preview-wrap { min-height: auto; padding: 12px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel">
      <h1>台電 LOGO 迷因產生器</h1>
      <p class="hint">輸入一句中文，其他全部自動：紅黑分段、英文副標、徽章主題、台電迷因圈和電力閃電都會直接產生。</p>

      <label>輸入中文迷因</label>
      <textarea id="title" placeholder="例如：電來了但我的耐心沒來">停電不是問題 冷氣才是信仰</textarea>

      <input id="subtitle" type="hidden" value="POWER MAY FLICKER. THE AC MUST REMAIN." />
      <input id="blackPart" type="hidden" value="停電不是問題" />
      <input id="redPart" type="hidden" value="冷氣才是信仰" />
      <input id="ringText" type="hidden" value="台電迷因圈 POWER MEME UNIT" />
      <input id="titleSize" type="hidden" value="86" />
      <input id="subSize" type="hidden" value="32" />
      <select id="ratio" hidden>
        <option value="wide" selected>寬版宣導圖</option>
      </select>
      <select id="iconMode" hidden>
        <option value="auto" selected>依文字自動判斷</option>
        <option value="plug">插頭鼠</option>
        <option value="drone">軍購無人機</option>
        <option value="ac">冷氣信仰</option>
        <option value="bill">帳單爆擊</option>
      </select>
      <input id="logoUpload" type="file" accept="image/*" hidden />

      <button id="randomBtn">隨機迷因</button>
      <button id="downloadBtn">下載 PNG</button>
      <button class="secondary" id="resetBtn">清空重打</button>

      <p class="note">公開網頁版已簡化成一鍵玩法。這是戲仿迷因工具，不代表任何公司或機關。</p>
    </section>

    <section class="preview-wrap">
      <canvas id="canvas" width="1800" height="900"></canvas>
    </section>
  </main>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const titleInput = document.getElementById('title');
    const subtitleInput = document.getElementById('subtitle');
    const ratioInput = document.getElementById('ratio');
    const iconModeInput = document.getElementById('iconMode');
    const blackPartInput = document.getElementById('blackPart');
    const redPartInput = document.getElementById('redPart');
    const ringTextInput = document.getElementById('ringText');
    const titleSizeInput = document.getElementById('titleSize');
    const subSizeInput = document.getElementById('subSize');
    const uploadInput = document.getElementById('logoUpload');
    let uploadedLogo = null;

    const ink = '#06265d';
    const red = '#b00012';
    const black = '#211816';
    const paper = '#fbfaf7';

    const presets = [
      {
        title: '停電不是問題 冷氣才是信仰',
        blackPart: '停電不是問題',
        redPart: '冷氣才是信仰',
        subtitle: 'POWER MAY FLICKER. THE AC MUST REMAIN.',
        icon: 'ac'
      },
      {
        title: '電費帳單刻不容緩 薪水防線全面失守',
        blackPart: '電費帳單刻不容緩',
        redPart: '薪水防線全面失守',
        subtitle: 'THE BILL HAS ARRIVED. EMOTIONAL DAMAGE IS CONFIRMED.',
        icon: 'bill'
      },
      {
        title: '鼠患防治刻不容緩 插頭安全你我有責',
        blackPart: '鼠患防治刻不容緩',
        redPart: '插頭安全你我有責',
        subtitle: 'ACT NOW ON RODENT CONTROL. DO NOT LET THE PLUG BECOME A SNACK.',
        icon: 'plug'
      },
      {
        title: '支持 1.25 兆軍購 強化國防守護台灣',
        blackPart: '支持 1.25 兆軍購',
        redPart: '強化國防守護台灣',
        subtitle: 'SUPPORT 1.25 TRILLION IN MILITARY PURCHASES. PROTECT TAIWAN.',
        icon: 'drone'
      },
      {
        title: '供電吃緊刻不容緩 先把冰箱門關好',
        blackPart: '供電吃緊刻不容緩',
        redPart: '先把冰箱門關好',
        subtitle: 'GRID PRESSURE IS REAL. SO IS YOUR OPEN FRIDGE DOOR.',
        icon: 'plug'
      },
      {
        title: '電來了但耐心沒來 情緒修復刻不容緩',
        blackPart: '電來了但耐心沒來',
        redPart: '情緒修復刻不容緩',
        subtitle: 'POWER RESTORED. INNER PEACE STILL UNDER MAINTENANCE.',
        icon: 'bill'
      }
    ];

    const englishTemplates = {
      ac: [
        'POWER MAY FLICKER. THE AC MUST REMAIN.',
        'GRID STATUS UNCLEAR. AIR CONDITIONING FAITH UNBROKEN.',
        'SAVE ELECTRICITY, BUT DO NOT TEST MY SUMMER.'
      ],
      bill: [
        'THE BILL HAS ARRIVED. EMOTIONAL DAMAGE IS CONFIRMED.',
        'PAYMENT DUE. INNER PEACE OVERDUE.',
        'PLEASE REMAIN CALM WHILE YOUR WALLET REBOOTS.'
      ],
      drone: [
        'ACTION CAN WAIT? THE BUDGET CANNOT.',
        'SUPPORT THE PLAN. QUESTION THE RECEIPT.',
        'NATIONAL DEFENSE, PERSONAL CONFUSION.'
      ],
      plug: [
        'ACT NOW. THE PLUG HAS SEEN TOO MUCH.',
        'ELECTRICAL SAFETY IS EVERYONE’S RESPONSIBILITY.',
        'PLEASE SECURE THE CABLE BEFORE IT BECOMES A STORY.'
      ],
      default: [
        'PUBLIC NOTICE: PLEASE REMAIN EMOTIONALLY GROUNDED.',
        'ACTION CANNOT WAIT. COMMON SENSE ALSO CANNOT WAIT.',
        'A CLEAN GRID BEGINS WITH A CONFUSED CITIZEN.'
      ]
    };

    function setCanvasRatio() {
      const ratio = ratioInput.value;
      if (ratio === 'wide') { canvas.width = 1800; canvas.height = 900; }
      if (ratio === '16:9') { canvas.width = 1600; canvas.height = 900; }
      if (ratio === '1:1') { canvas.width = 1200; canvas.height = 1200; }
      if (ratio === '9:16') { canvas.width = 900; canvas.height = 1600; }
    }

    function detectTheme() {
      const text = titleInput.value.toLowerCase();
      if (text.includes('軍購') || text.includes('國防') || text.includes('drone') || text.includes('military')) return 'drone';
      if (text.includes('冷氣') || text.includes('ac') || text.includes('air')) return 'ac';
      if (text.includes('電費') || text.includes('帳單') || text.includes('薪水') || text.includes('錢') || text.includes('bill')) return 'bill';
      if (text.includes('鼠') || text.includes('插頭') || text.includes('延長線') || text.includes('電線') || text.includes('rodent') || text.includes('plug')) return 'plug';
      return 'plug';
    }

    function hashText(text) {
      let hash = 0;
      for (const char of text) hash = ((hash << 5) - hash + char.charCodeAt(0)) | 0;
      return Math.abs(hash);
    }

    function splitChineseLine(text) {
      const clean = text.replace(/\s+/g, ' ').trim() || '停電不是問題 冷氣才是信仰';
      const separators = ['，', '。', '！', '？', ',', '.', '!', '?', '；', ';', '、'];
      for (const sep of separators) {
        const index = clean.indexOf(sep);
        if (index > 1 && index < clean.length - 1) {
          return [clean.slice(0, index).trim(), clean.slice(index + 1).trim()];
        }
      }
      const compact = clean.replace(/\s+/g, '');
      const pivots = ['刻不容緩', '不是問題', '你我有責', '全面失守', '守護台灣', '才是信仰', '先不要'];
      for (const pivot of pivots) {
        const index = compact.indexOf(pivot);
        if (index > 0 && index + pivot.length < compact.length) {
          return [compact.slice(0, index + pivot.length), compact.slice(index + pivot.length)];
        }
      }
      const midpoint = Math.ceil(compact.length / 2);
      return [compact.slice(0, midpoint), compact.slice(midpoint)];
    }

    function autoSubtitle(text, theme) {
      const bank = englishTemplates[theme] || englishTemplates.default;
      return bank[hashText(text) % bank.length];
    }

    function autoTitleSize(text) {
      const length = text.replace(/\s+/g, '').length;
      if (length <= 12) return 94;
      if (length <= 18) return 84;
      if (length <= 26) return 72;
      return 60;
    }

    function autoGenerateFromTitle() {
      const text = titleInput.value.trim() || '停電不是問題 冷氣才是信仰';
      const [blackPart, redPart] = splitChineseLine(text);
      const theme = detectTheme();
      blackPartInput.value = blackPart;
      redPartInput.value = redPart || '刻不容緩';
      subtitleInput.value = autoSubtitle(text, theme);
      iconModeInput.value = theme;
      ratioInput.value = 'wide';
      ringTextInput.value = '台電迷因圈 POWER MEME UNIT';
      titleSizeInput.value = autoTitleSize(text);
      subSizeInput.value = text.length > 22 ? 28 : 32;
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function drawBolt(x, y, size, angle = 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.fillStyle = red;
      ctx.beginPath();
      ctx.moveTo(size * -0.10, size * -0.50);
      ctx.lineTo(size * 0.26, size * -0.12);
      ctx.lineTo(size * 0.04, size * -0.08);
      ctx.lineTo(size * 0.20, size * 0.50);
      ctx.lineTo(size * -0.26, size * 0.05);
      ctx.lineTo(size * -0.03, size * 0.01);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawRingText(cx, cy, radius, text) {
      const chars = text.split('');
      const start = Math.PI * 1.12;
      const end = Math.PI * 1.88;
      ctx.save();
      ctx.fillStyle = ink;
      ctx.font = `800 ${radius * 0.085}px "Noto Sans TC", "Microsoft JhengHei", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      chars.forEach((char, index) => {
        const t = chars.length === 1 ? 0.5 : index / (chars.length - 1);
        const a = start + (end - start) * t;
        ctx.save();
        ctx.translate(cx + Math.cos(a) * radius * 0.80, cy + Math.sin(a) * radius * 0.80);
        ctx.rotate(a + Math.PI / 2);
        ctx.fillText(char, 0, 0);
        ctx.restore();
      });
      ctx.restore();
    }

    function drawBadgeBase(cx, cy, radius) {
      ctx.save();
      ctx.strokeStyle = ink;
      ctx.lineWidth = radius * 0.022;
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.arc(cx, cy, radius - i * radius * 0.045, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.lineWidth = radius * 0.011;
      ctx.beginPath();
      ctx.arc(cx, cy, radius * 0.68, 0, Math.PI * 2);
      ctx.stroke();
      drawRingText(cx, cy, radius, ringTextInput.value || '台電迷因圈 POWER MEME UNIT');
      ctx.restore();
    }

    function drawPowerBolts(cx, cy, radius) {
      const bolts = [
        [-0.58, -0.22, -0.55],
        [0.60, -0.12, 0.38],
        [-0.34, 0.55, -0.95],
        [0.35, 0.54, 0.62]
      ];
      bolts.forEach(([dx, dy, angle]) => drawBolt(cx + dx * radius, cy + dy * radius, radius * 0.30, angle));
    }

    function drawPlugMouse(cx, cy, r) {
      ctx.save();
      ctx.fillStyle = ink;
      ctx.strokeStyle = ink;
      ctx.lineWidth = r * 0.045;
      ctx.beginPath();
      ctx.ellipse(cx - r * .05, cy + r * .04, r * .38, r * .23, -0.18, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx - r * .35, cy - r * .08, r * .16, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx - r * .43, cy - r * .23, r * .08, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx - r * .27, cy - r * .25, r * .07, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx + r * .30, cy + r * .08);
      ctx.bezierCurveTo(cx + r * .62, cy + r * .25, cx + r * .50, cy + r * .62, cx + r * .18, cy + r * .56);
      ctx.stroke();
      ctx.strokeStyle = paper;
      ctx.lineWidth = r * 0.018;
      ctx.beginPath();
      ctx.moveTo(cx - r * .50, cy - r * .06);
      ctx.lineTo(cx - r * .70, cy - r * .10);
      ctx.moveTo(cx - r * .50, cy - r * .02);
      ctx.lineTo(cx - r * .72, cy + r * .04);
      ctx.stroke();
      ctx.strokeStyle = ink;
      ctx.lineWidth = r * 0.035;
      ctx.beginPath();
      ctx.moveTo(cx - r * .26, cy + r * .24);
      ctx.lineTo(cx - r * .26, cy + r * .52);
      ctx.stroke();
      ctx.fillRect(cx - r * .36, cy + r * .50, r * .20, r * .20);
      ctx.restore();
    }

    function drawDrone(cx, cy, r) {
      ctx.save();
      ctx.strokeStyle = ink;
      ctx.fillStyle = ink;
      ctx.lineWidth = r * 0.050;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(cx - r * .45, cy);
      ctx.lineTo(cx + r * .45, cy);
      ctx.moveTo(cx, cy - r * .28);
      ctx.lineTo(cx, cy + r * .34);
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(cx, cy, r * .19, r * .12, 0, 0, Math.PI * 2);
      ctx.fill();
      [[-0.55,-0.20],[0.55,-0.20],[-0.55,0.28],[0.55,0.28]].forEach(([dx, dy]) => {
        ctx.beginPath();
        ctx.ellipse(cx + r * dx, cy + r * dy, r * .18, r * .045, 0, 0, Math.PI * 2);
        ctx.stroke();
      });
      ctx.beginPath();
      ctx.arc(cx, cy + r * .30, r * .11, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function drawAC(cx, cy, r) {
      ctx.save();
      ctx.strokeStyle = ink;
      ctx.fillStyle = ink;
      ctx.lineWidth = r * 0.045;
      roundRect(cx - r * .48, cy - r * .36, r * .96, r * .34, r * .05);
      ctx.stroke();
      ctx.fillRect(cx - r * .38, cy - r * .20, r * .76, r * .06);
      ctx.beginPath();
      ctx.arc(cx + r * .33, cy - r * .26, r * .035, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = r * 0.030;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(cx + i * r * .20, cy + r * .03);
        ctx.bezierCurveTo(cx + i * r * .10, cy + r * .20, cx + i * r * .24, cy + r * .34, cx + i * r * .08, cy + r * .50);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawBill(cx, cy, r) {
      ctx.save();
      ctx.strokeStyle = ink;
      ctx.fillStyle = ink;
      ctx.lineWidth = r * 0.045;
      roundRect(cx - r * .33, cy - r * .48, r * .66, r * .88, r * .03);
      ctx.stroke();
      ctx.font = `900 ${r * .20}px Arial, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('$', cx, cy - r * .18);
      ctx.lineWidth = r * 0.030;
      [-0.02, 0.16, 0.32].forEach(dy => {
        ctx.beginPath();
        ctx.moveTo(cx - r * .21, cy + r * dy);
        ctx.lineTo(cx + r * .21, cy + r * dy);
        ctx.stroke();
      });
      drawBolt(cx + r * .38, cy + r * .30, r * .28, 0.3);
      ctx.restore();
    }

    function drawUploaded(cx, cy, r) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, r * .60, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(uploadedLogo, cx - r * .60, cy - r * .60, r * 1.2, r * 1.2);
      ctx.restore();
    }

    function drawThemeIcon(cx, cy, r) {
      drawBadgeBase(cx, cy, r);
      drawPowerBolts(cx, cy, r);
      let mode = iconModeInput.value;
      if (mode === 'auto') mode = detectTheme();
      if (mode === 'upload' && uploadedLogo) drawUploaded(cx, cy, r);
      else if (mode === 'drone') drawDrone(cx, cy, r * .78);
      else if (mode === 'ac') drawAC(cx, cy, r * .78);
      else if (mode === 'bill') drawBill(cx, cy, r * .78);
      else drawPlugMouse(cx, cy, r * .78);
    }

    function drawFitText(text, x, y, maxWidth, size, color, maxLines = 1) {
      const fontFamily = '"Noto Sans TC", "Microsoft JhengHei", "Arial Black", sans-serif';
      let fontSize = size;
      const chunks = text.trim().split(/\s+/);
      if (text.match(/[\u4e00-\u9fff]/)) {
        chunks.length = 0;
        for (const char of text.trim()) chunks.push(char);
      }

      function buildLines() {
        ctx.font = `900 ${fontSize}px ${fontFamily}`;
        const lines = [];
        let line = '';
        chunks.forEach(chunk => {
          const candidate = text.match(/[\u4e00-\u9fff]/) ? line + chunk : `${line} ${chunk}`.trim();
          if (ctx.measureText(candidate).width > maxWidth && line) {
            lines.push(line);
            line = chunk;
          } else {
            line = candidate;
          }
        });
        if (line) lines.push(line);
        return lines;
      }

      let lines = buildLines();
      while ((lines.length > maxLines || lines.some(line => ctx.measureText(line).width > maxWidth)) && fontSize > 22) {
        fontSize -= 2;
        lines = buildLines();
      }
      ctx.fillStyle = color;
      ctx.font = `900 ${fontSize}px ${fontFamily}`;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      lines.slice(0, maxLines).forEach((line, index) => ctx.fillText(line, x, y + index * fontSize * 1.08));
      return { fontSize, lineCount: Math.min(lines.length, maxLines), height: Math.min(lines.length, maxLines) * fontSize * 1.08 };
    }

    function drawDesktopLayout(w, h) {
      const badgeR = h * 0.19;
      const badgeCx = w * 0.13;
      const badgeCy = h * 0.50;
      drawThemeIcon(badgeCx, badgeCy, badgeR);

      ctx.strokeStyle = ink;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(w * 0.23, h * 0.26);
      ctx.lineTo(w * 0.23, h * 0.74);
      ctx.stroke();

      const textX = w * 0.255;
      const textY = h * 0.335;
      const textW = w * 0.63;
      const titleSize = Number(titleSizeInput.value);
      const blackPart = blackPartInput.value || titleInput.value;
      const redPart = redPartInput.value;

      const blackResult = drawFitText(blackPart, textX, textY, textW * 0.52, titleSize, black, 1);
      const redX = textX + Math.min(ctx.measureText(blackPart).width + titleSize * .28, textW * 0.55);
      drawFitText(redPart, redX, textY, textW - (redX - textX), titleSize, red, 1);

      const lineY = textY + blackResult.fontSize * 1.17;
      ctx.strokeStyle = ink;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(textX, lineY);
      ctx.lineTo(textX + textW, lineY);
      ctx.stroke();

      drawFitText(subtitleInput.value.toUpperCase(), textX, lineY + h * 0.025, textW, Number(subSizeInput.value), ink, 1);
      drawBolt(w * 0.94, h * 0.50, h * 0.18, 0.16);
    }

    function drawStackedLayout(w, h) {
      const badgeR = Math.min(w, h) * 0.22;
      const badgeCx = w * 0.50;
      const badgeCy = h * 0.23;
      drawThemeIcon(badgeCx, badgeCy, badgeR);

      const textX = w * 0.11;
      const textY = h * 0.49;
      const textW = w * 0.78;
      const titleSize = Number(titleSizeInput.value);

      const blackResult = drawFitText(blackPartInput.value || titleInput.value, textX, textY, textW, titleSize, black, 2);
      drawFitText(redPartInput.value, textX, textY + blackResult.height + h * 0.018, textW, titleSize, red, 2);

      const lineY = textY + blackResult.height + titleSize * 1.22;
      ctx.strokeStyle = ink;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(textX, lineY);
      ctx.lineTo(textX + textW, lineY);
      ctx.stroke();
      drawFitText(subtitleInput.value.toUpperCase(), textX, lineY + h * 0.025, textW, Number(subSizeInput.value), ink, 3);
      drawBolt(w * 0.86, h * 0.88, Math.min(w, h) * 0.12, 0.2);
    }

    function draw() {
      autoGenerateFromTitle();
      setCanvasRatio();
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = paper;
      ctx.fillRect(0, 0, w, h);

      if (h > w || w < 1300) drawStackedLayout(w, h);
      else drawDesktopLayout(w, h);
    }

    function syncTitleFromParts() {
      titleInput.value = `${blackPartInput.value} ${redPartInput.value}`.trim();
    }

    function applyPreset(preset) {
      titleInput.value = preset.title;
      blackPartInput.value = preset.blackPart;
      redPartInput.value = preset.redPart;
      subtitleInput.value = preset.subtitle;
      iconModeInput.value = preset.icon;
      titleSizeInput.value = autoTitleSize(preset.title);
      draw();
    }

    titleInput.addEventListener('input', draw);
    [subtitleInput, ratioInput, iconModeInput, ringTextInput, titleSizeInput, subSizeInput].forEach(el => {
      el.addEventListener('input', draw);
      el.addEventListener('change', draw);
    });
    [blackPartInput, redPartInput].forEach(el => {
      el.addEventListener('input', () => {
        syncTitleFromParts();
        draw();
      });
    });

    uploadInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        uploadedLogo = new Image();
        uploadedLogo.onload = () => {
          iconModeInput.value = 'upload';
          draw();
        };
        uploadedLogo.src = reader.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('randomBtn').addEventListener('click', () => {
      applyPreset(presets[Math.floor(Math.random() * presets.length)]);
    });

    document.getElementById('downloadBtn').addEventListener('click', () => {
      draw();
      const link = document.createElement('a');
      link.download = 'taipower-logo-meme.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      titleInput.value = '';
      uploadedLogo = null;
      uploadInput.value = '';
      draw();
      titleInput.focus();
    });

    draw();
  </script>
</body>
</html>
